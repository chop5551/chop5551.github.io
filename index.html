<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Для тебя</title>
  <style>
    :root{
      --pink1:#ff5aa5;
      --pink2:#ff87c2;
      --pink3:#ffd3e8;
      --bg1:#fff0f7;
      --bg2:#ffe3f1;
      --card:#ffffffcc;
      --text:#3b1d2a;
      --danger:#ff3b7a;
    }

    *{ box-sizing: border-box; }

    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Helvetica Neue";
      background:
        radial-gradient(1200px 700px at 20% 10%, var(--bg1), transparent 60%),
        radial-gradient(900px 600px at 80% 30%, var(--bg2), transparent 55%),
        linear-gradient(180deg, #fff, #fff6fb);
      color: var(--text);
      min-height: 100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 18px;
    }

    .card{
      position: relative;
      width: min(760px, 96vw);
      background: var(--card);
      backdrop-filter: blur(10px);
      border: 1px solid #ffd0e6;
      border-radius: 28px;
      box-shadow: 0 20px 80px rgba(255, 90, 165, 0.18);
      overflow:hidden;
    }

    .top{
      padding: 34px 22px 14px;
      text-align:center;
    }

    h1{
      margin:0 0 10px;
      font-size: clamp(22px, 3.2vw, 34px);
      letter-spacing: 0.2px;
    }

    .hint{
      margin:0;
      opacity:.85;
      font-size:15px;
    }

    .notify-wrap{
      position:absolute;
      top:16px;
      right:16px;
      z-index:5;
    }

    .notify-btn{
      position:relative;
      width:64px;
      height:64px;
      border:0;
      border-radius:50%;
      cursor:pointer;
      display:grid;
      place-items:center;
      background:
        radial-gradient(circle at 30% 30%, #fff, #ffe9f3 45%, #ffd0e6 100%);
      box-shadow:
        0 12px 30px rgba(255, 90, 165, 0.28),
        inset 0 2px 10px rgba(255,255,255,.9);
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
    }

    .notify-btn:hover{
      transform: translateY(-2px) scale(1.02);
      box-shadow:
        0 16px 36px rgba(255, 90, 165, 0.35),
        inset 0 2px 10px rgba(255,255,255,.95);
      filter: brightness(1.02);
    }

    .notify-btn:active{
      transform: scale(.98);
    }

    .notify-btn::before{
      content:"";
      position:absolute;
      inset:-7px;
      border-radius:50%;
      border:2px solid rgba(255, 90, 165, .22);
      opacity:0;
      transform:scale(.9);
    }

    .notify-btn.ringing::before{
      animation: bellPulse 1.6s ease-out infinite;
    }

    .bell-icon{
      width:30px;
      height:30px;
      fill: url(#bellGradient);
      transform-origin: top center;
      filter: drop-shadow(0 5px 10px rgba(255, 90, 165, 0.22));
    }

    .notify-btn.ringing .bell-icon{
      animation: bellRing 1.15s ease-in-out infinite;
    }

    .badge{
      position:absolute;
      top:-4px;
      right:-2px;
      min-width:24px;
      height:24px;
      padding:0 7px;
      border-radius:999px;
      display:flex;
      align-items:center;
      justify-content:center;
      background: linear-gradient(135deg, #ff2f74, #ff6a9d);
      color:#fff;
      font-size:13px;
      font-weight:800;
      box-shadow: 0 10px 18px rgba(255, 47, 116, .35);
      border: 2px solid #fff7fb;
      transition: opacity .25s ease, transform .25s ease;
    }

    .badge.hide{
      opacity:0;
      transform: scale(.5);
      pointer-events:none;
    }

    .love-toast{
      display:none;
      margin: 0 22px 18px;
      padding: 16px 18px;
      border-radius: 22px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.95), rgba(255,233,243,.95));
      border: 1px solid #ffc7df;
      box-shadow: 0 14px 40px rgba(255, 90, 165, 0.16);
      animation: toastIn .45s ease-out;
    }

    .love-toast.show{
      display:block;
    }

    .love-title{
      display:flex;
      align-items:center;
      gap:10px;
      margin:0 0 8px;
      font-weight:800;
      color: var(--pink1);
      font-size: 16px;
    }

    .love-dot{
      width:10px;
      height:10px;
      border-radius:50%;
      background: linear-gradient(135deg, var(--pink1), var(--pink2));
      box-shadow: 0 0 0 8px rgba(255, 90, 165, 0.12);
      flex: 0 0 auto;
    }

    .love-text{
      margin:0;
      font-size: clamp(16px, 2.5vw, 21px);
      line-height:1.5;
      font-weight:700;
      text-align:center;
    }

    .love-emoji{
      margin-top:10px;
      text-align:center;
      font-size: clamp(22px, 4vw, 30px);
      letter-spacing: 4px;
      animation: sparkle 1.8s ease-in-out infinite;
    }

    .actions{
      width: 100%;
      display:flex;
      justify-content:center;
      align-items:center;
      padding: 16px 22px 22px;
    }

    button.main-btn{
      cursor:pointer;
      border:0;
      padding: 14px 20px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 16px;
      color: white;
      background: linear-gradient(135deg, var(--pink1), var(--pink2));
      box-shadow: 0 12px 30px rgba(255, 90, 165, 0.35);
      transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
      display: block;
      margin: 0 auto;
    }

    button.main-btn:hover{
      transform: translateY(-1px);
      filter: brightness(1.02);
      box-shadow: 0 16px 40px rgba(255, 90, 165, 0.42);
    }

    button.main-btn:active{
      transform: translateY(0px) scale(0.99);
    }

    .content{
      padding: 0 22px 18px;
      display:none;
      animation: pop .35s ease-out;
    }

    @keyframes pop{
      from{ transform: translateY(6px); opacity: 0; }
      to{ transform: translateY(0); opacity: 1; }
    }

    @keyframes fadeUp{
      from{ opacity:0; transform: translateY(8px); }
      to{ opacity:1; transform: translateY(0); }
    }

    @keyframes toastIn{
      from{ opacity:0; transform: translateY(-10px) scale(.98); }
      to{ opacity:1; transform: translateY(0) scale(1); }
    }

    @keyframes bellRing{
      0%, 100% { transform: rotate(0deg); }
      10% { transform: rotate(18deg); }
      20% { transform: rotate(-16deg); }
      30% { transform: rotate(14deg); }
      40% { transform: rotate(-10deg); }
      50% { transform: rotate(6deg); }
      60% { transform: rotate(-4deg); }
      70% { transform: rotate(2deg); }
    }

    @keyframes bellPulse{
      0%{
        opacity:.65;
        transform:scale(.9);
      }
      70%{
        opacity:0;
        transform:scale(1.28);
      }
      100%{
        opacity:0;
        transform:scale(1.35);
      }
    }

    @keyframes sparkle{
      0%,100%{ transform: translateY(0); opacity: 1; }
      50%{ transform: translateY(-2px); opacity: .9; }
    }

    .animate{
      animation: fadeUp .45s ease-out;
    }

    .caption{
      margin: 0 0 12px;
      text-align:center;
      font-weight: 800;
      font-size: clamp(18px, 3vw, 30px);
      color: var(--pink1);
      text-shadow: 0 8px 30px rgba(255, 90, 165, 0.25);
    }

    .photo{
      width: 100%;
      max-height: 52vh;
      object-fit: contain;
      border-radius: 22px;
      border: 1px solid #ffd0e6;
      box-shadow: 0 14px 40px rgba(0,0,0,0.08);
      display:block;
      background: rgba(255,255,255,0.55);
    }

    .footer{
      padding: 0 22px 18px;
      text-align:center;
      font-size: 12px;
      opacity: .6;
    }

    @media (max-width: 420px){
      .photo{ max-height: 46vh; }
      button.main-btn{ width: min(320px, 100%); }
      .notify-btn{
        width:58px;
        height:58px;
      }
      .badge{
        min-width:22px;
        height:22px;
        font-size:12px;
      }
      .love-text{
        font-size: 17px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="notify-wrap">
      <button class="notify-btn ringing" id="notifyBell" aria-label="Открыть уведомление">
        <svg width="0" height="0" style="position:absolute">
          <defs>
            <linearGradient id="bellGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ff5aa5"></stop>
              <stop offset="100%" stop-color="#ff87c2"></stop>
            </linearGradient>
          </defs>
        </svg>

        <svg class="bell-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-5h-1V11a6 6 0 1 0-12 0v6H5a1 1 0 1 0 0 2h14a1 1 0 1 0 0-2Zm-3 0H8V11a4 4 0 1 1 8 0v6Z"/>
        </svg>

        <span class="badge" id="notifyBadge">1</span>
      </button>
    </div>

    <div class="top">
      <h1>Маленький секрет</h1>
      <p class="hint">Нажми на колокольчик сверху или на кнопку ниже 💖</p>
    </div>

    <div class="love-toast" id="loveToast">
      <div class="love-title">
        <span class="love-dot"></span>
        Новое любовное уведомление
      </div>
      <p class="love-text">Яночка, я тебя люблю ! Хорошего дня малышка !</p>
      <div class="love-emoji">💖 💘 💝 💕 💞 🌷 ✨ 🥰</div>
    </div>

    <div class="actions" id="actionsStart">
      <button class="main-btn" id="btnStart">Если мышка то нажми</button>
    </div>

    <div class="content" id="screen">
      <div class="caption" id="caption"></div>
      <img class="photo" id="photo" src="" alt="Фото" />

      <div class="actions" id="actionsInScreen" style="padding:16px 22px 0;">
        <button class="main-btn" id="btnNext">Ещё раз</button>
      </div>
    </div>

    <div class="footer">Сделано с нежностью</div>
  </div>

  <script>
    const IMAGES = Array.from({ length: 40 }, (_, i) => `./img/${i + 1}.jpg`);

    const W1 = ["Яночка", "Яночка", "Яночка", "Мышка", "Мышка пушистая", "Зайка", "Котик", "Зубастик", "Зубик", "Зубочистка", "Мышеловка", "Крошечка", "Красавица моя", "Принцесса"];
    const W2 = ["люблю", "целую", "обнимаю", "ценю", "люблю", "люблю", "благодарю", "уважаю"];
    const W3 = ["сильно", "нежно", "безгранично", "всей душой", "твой ослик"];

    const actionsStart = document.getElementById("actionsStart");
    const screen = document.getElementById("screen");

    const btnStart = document.getElementById("btnStart");
    const btnNext  = document.getElementById("btnNext");

    const caption = document.getElementById("caption");
    const photo   = document.getElementById("photo");

    const notifyBell  = document.getElementById("notifyBell");
    const notifyBadge = document.getElementById("notifyBadge");
    const loveToast   = document.getElementById("loveToast");

    let notificationOpened = false;

    function show(el){ el.style.display = "block"; }
    function hide(el){ el.style.display = "none"; }

    function pick(arr){
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function restartCaptionAnimation(){
      caption.classList.remove("animate");
      void caption.offsetWidth;
      caption.classList.add("animate");
    }

    function generate(){
      const phrase = `${pick(W1)} ${pick(W2)} ${pick(W3)}`;
      caption.textContent = phrase;

      const img = pick(IMAGES);
      photo.src = img + `?v=${Date.now()}`;

      restartCaptionAnimation();
    }

    function goHome(){
      hide(screen);
      show(actionsStart);
      caption.textContent = "";
      photo.src = "";
    }

    function openLoveNotification(){
      if (notificationOpened) return;

      notificationOpened = true;
      notifyBadge.classList.add("hide");
      notifyBell.classList.remove("ringing");
      loveToast.classList.add("show");
    }

    notifyBell.addEventListener("click", openLoveNotification);

    btnStart.addEventListener("click", () => {
      hide(actionsStart);
      show(screen);
      generate();
    });

    btnNext.addEventListener("click", () => {
      generate();
    });

    goHome();
  </script>
</body>
</html>
